    <script>
      // Cleanly handle Vite HMR in AI Studio cloud proxy / iframe environment
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = (protocols === 'vite-hmr') ||
              (typeof protocols === 'object' && protocols && protocols.indexOf && protocols.indexOf('vite-hmr') !== -1) ||
              (String(url || '').indexOf('vite') !== -1);
            if (isViteHmr) {
              var listeners = {};
              var wsMock = {
                readyState: 1, // OPEN (1) prevents @vite/client from rejecting with 'WebSocket closed without opened'
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url || ''),
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() {
                      try {
                        handler({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                  }
                },
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              return wsMock;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || String(arg))) || '';
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('[vite]') !== -1) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.includes('WebSocket') ||
              event.message.includes('ws://') ||
              event.message.includes('wss://'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String(event.reason || '');
          if (reasonStr.includes('WebSocket') || (event.reason && String(event.reason.message || '').includes('WebSocket'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
